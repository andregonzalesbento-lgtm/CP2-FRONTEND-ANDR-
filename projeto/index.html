<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéTrade TCG</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section id="inicio" class="secao">
    <h2>Cartas Pokémon</h2>

    <div class="grid-cartas">
        <img src="imagens/carta1.png" class="card-img" alt="Carta 1">
        <img src="imagens/carta2.png" class="card-img" alt="Carta 2">
        <img src="imagens/carta3.png" class="card-img" alt="Carta 3">
        <img src="imagens/carta4.png" class="card-img" alt="Carta 4">
    </div>
</section>


<section id="formulario" class="secao">
    <h2>Cartas Raras</h2>

    <div class="grid-cartas">
        <img src="imagens/rara1.png" class="card-img" alt="Carta rara 1">
        <img src="imagens/rara2.png" class="card-img" alt="Carta rara 2">
    </div>

    <form>
        <div class="campo">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Seu nome" required>
        </div>

        <div class="campo">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" placeholder="Seu email" required>
        </div>

        <div class="campo">
            <i class="fa-solid fa-dragon"></i>
            <input type="text" placeholder="Qual carta deseja avaliar?" required>
        </div>

        <div class="campo">
            <i class="fa-solid fa-dollar-sign"></i>
            <input type="number" placeholder="Valor desejado (R$)" required>
        </div>

        <button type="submit">Enviar</button>
    </form>
</section>
<header>
    <h1>🔥 PokéTrade TCG 🔥</h1>
    <nav>
        <a href="#inicio">Início</a>
        <a href="#formulario">Venda</a>
        <a href="#busca">Buscar</a>
        <a href="#sobre">Sobre</a>
    </nav>
</header>
